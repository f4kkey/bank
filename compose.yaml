services:
  java:
    build:
      context: ./java/bank
      dockerfile: Dockerfile
    container_name: java-bank
    restart: always
    env_file:
      - ./java/bank/.env
    depends_on:
      - db
      - redis
      - minio

  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: php-bank
    restart: always
    environment:
      JAVA_HOST: java
      REDIS_HOST: redis
    depends_on:
      - java
      - redis

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx-bank
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - php

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: 12345678
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server
    volumes:
      - redis_data:/data

  db:
    image: mariadb:11
    container_name: mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: bank
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  db_data:
  minio_data:
  redis_data:
