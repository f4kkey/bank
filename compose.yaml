services:
  bank:
    build:
      context: ./java/bank
      dockerfile: Dockerfile
    container_name: bank
    restart: always
    environment:
      VAULT_ADDR: http://bank-vault:8200
      VAULT_TOKEN: 1
    depends_on:
      bank-db:
        condition: service_healthy
      bank-redis:
        condition: service_started
      bank-minio:
        condition: service_started
      bank-vault-init:
        condition: service_completed_successfully

  bank-php-gateway:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: bank-php-gateway
    restart: always
    environment:
      JAVA_HOST: bank
      REDIS_HOST: bank-redis
      INTERNAL_API_SECRET: b8f2a9c1-4e3d-4a7b-9f1e-6d5c8a2b3e4f
      KONG_API_KEY: d4f8e2a1-7b3c-4f9e-a6d5-8c1b2e3f4a5d
    depends_on:
      bank:
        condition: service_started
      bank-redis:
        condition: service_started

  bank-nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: bank-nginx
    restart: always
    depends_on:
      bank-php-gateway:
        condition: service_started

  bank-minio:
    image: minio/minio
    container_name: bank-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: 12345678
    volumes:
      - bank_minio_data:/data
    command: server /data --console-address ":9001"

  bank-redis:
    image: redis
    container_name: bank-redis
    command: redis-server
    volumes:
      - bank_redis_data:/data

  bank-db:
    image: mariadb
    container_name: bank-db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: 1
      MARIADB_DATABASE: bank
      MARIADB_USER: user
      MARIADB_PASSWORD: 1
    ports:
      - 33063:3306
    volumes:
      - bank_db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  bank-vault:
    image: hashicorp/vault:1.21
    container_name: bank-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: 1
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_DISABLE_MLOCK: "true"
    entrypoint: vault
    command: server -dev

  bank-vault-init:
    image: hashicorp/vault:1.21
    container_name: bank-vault-init
    environment:
      VAULT_ADDR: http://bank-vault:8200
      VAULT_TOKEN: 1
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "[vault-init] Waiting for Vault to be ready..."
        until vault status > /dev/null 2>&1; do
          echo "[vault-init] Vault not ready yet, retrying in 2s..."
          sleep 2
        done
        echo "[vault-init] Vault is ready. Enabling KV v2 secrets engine..."
        vault secrets enable -path=secret kv-v2 2>/dev/null || true
        echo "[vault-init] Writing bank secrets..."
        vault kv put secret/bank \
          mariadb_url="jdbc:mariadb://bank-db:3306/bank" \
          mariadb_user="user" \
          mariadb_password="1" \
          minio_url="http://bank-minio:9000" \
          minio_user="admin" \
          minio_password="12345678" \
          redis_host="bank-redis" \
          server_shop_url="http://shop-nginx" \
          INTERNAL_API_SECRET="b8f2a9c1-4e3d-4a7b-9f1e-6d5c8a2b3e4f"
        echo "[vault-init] Secrets written successfully."
    depends_on:
      - bank-vault

volumes:
  bank_db_data:
  bank_minio_data:
  bank_redis_data: